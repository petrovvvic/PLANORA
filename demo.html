<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PLANORA – Dein KI-Reiseassistent</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#7C3AED; --purple-d:#6D28D9; --purple-l:#A78BFA;
    --lav:#F5F3FF; --lav-2:#EDE9FE; --ink:#1E1B2E; --muted:#6B7280;
    --line:#E7E4F0; --white:#fff; --green:#16a34a; --amber:#d97706;
    --shadow:0 10px 30px rgba(109,40,217,.12); --shadow-sm:0 4px 14px rgba(109,40,217,.10);
    --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:linear-gradient(160deg,#faf9ff 0%,#f1ecff 100%);
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100%;display:flex;flex-direction:column}
  .app{width:100%;max-width:820px;margin:0 auto;flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--white);box-shadow:0 0 60px rgba(109,40,217,.08)}
  /* Header */
  .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);z-index:20}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.5px;color:var(--ink)}
  .logo .mark{width:34px;height:34px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--purple-l));border-radius:11px;color:#fff}
  .hd a.back{font-size:13px;color:var(--purple-d);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:6px}
  .hd a.back:hover{text-decoration:underline}
  /* Chat area */
  .chat{flex:1;overflow-y:auto;padding:22px 20px 8px}
  .intro{text-align:center;padding:26px 10px 10px}
  .intro h1{font-size:24px;font-weight:800;margin-bottom:8px}
  .intro p{color:var(--muted);font-size:15px;max-width:460px;margin:0 auto}
  .msg{display:flex;margin:14px 0;gap:10px;animation:rise .35s ease}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:78%;padding:13px 16px;border-radius:18px;font-size:15px;line-height:1.5}
  .msg.bot .bubble{background:var(--lav);border-bottom-left-radius:6px}
  .msg.user .bubble{background:linear-gradient(135deg,var(--purple),var(--purple-d));color:#fff;border-bottom-right-radius:6px}
  .avatar{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--purple-l));color:#fff}
  /* Analyzing */
  .analyze{background:var(--lav);border-radius:18px;border-bottom-left-radius:6px;padding:14px 16px;max-width:78%}
  .astep{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted);padding:4px 0;opacity:.4;transition:.3s}
  .astep.on{opacity:1;color:var(--ink)}
  .astep .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--purple-l);flex-shrink:0}
  .astep.done .dot{background:var(--green);border-color:var(--green)}
  .astep.done .dot::after{content:"✓";color:#fff;font-size:10px;display:grid;place-items:center;height:100%}
  .typing{display:flex;gap:4px;padding:4px 2px}
  .typing span{width:8px;height:8px;background:var(--purple-l);border-radius:50%;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  /* Cards */
  .cards{display:flex;flex-direction:column;gap:14px;margin:6px 0 8px 44px}
  .rec-head{margin:4px 0 2px 44px;font-size:13px;font-weight:700;color:var(--purple-d);text-transform:uppercase;letter-spacing:.6px}
  .card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.2s;background:#fff;box-shadow:var(--shadow-sm)}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--purple-l)}
  .card .scene{height:120px;position:relative}
  .card .match{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.95);color:var(--purple-d);font-weight:800;font-size:12px;padding:5px 10px;border-radius:20px;box-shadow:var(--shadow-sm)}
  .card .body{padding:14px 16px}
  .card .body .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .card .body h3{font-size:18px;font-weight:800}
  .card .body .price{font-weight:800;color:var(--purple-d);font-size:16px;white-space:nowrap}
  .card .body .price small{display:block;font-weight:500;color:var(--muted);font-size:11px;text-align:right}
  .card .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .tag{font-size:12px;background:var(--lav-2);color:var(--purple-d);padding:4px 10px;border-radius:20px;font-weight:600}
  .compare-btn{margin:8px 0 4px 44px;align-self:flex-start;background:#fff;border:1.5px solid var(--purple-l);color:var(--purple-d);font-weight:700;font-size:13px;padding:9px 16px;border-radius:12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
  .compare-btn:hover{background:var(--lav)}
  /* Input bar */
  .inputbar{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:14px 16px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
  .chip{white-space:nowrap;background:var(--lav);border:1px solid var(--line);color:var(--purple-d);font-size:13px;padding:8px 13px;border-radius:20px;cursor:pointer;font-weight:600;flex-shrink:0}
  .chip:hover{background:var(--lav-2)}
  .ib-row{display:flex;gap:10px;align-items:flex-end}
  .ib-row textarea{flex:1;border:1.5px solid var(--line);border-radius:16px;padding:13px 16px;font-size:15px;font-family:inherit;resize:none;max-height:120px;outline:none;line-height:1.4}
  .ib-row textarea:focus{border-color:var(--purple-l)}
  .send{width:48px;height:48px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--purple-d));color:#fff;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:.2s}
  .send:hover{transform:scale(1.05)}
  .send:disabled{opacity:.4;cursor:not-allowed;transform:none}
  /* Detail */
  .detail{flex:1;overflow-y:auto}
  .d-hero{height:200px;position:relative;display:flex;align-items:flex-end}
  .d-hero .d-title{position:relative;padding:20px;color:#fff}
  .d-hero .d-title h2{font-size:28px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.3)}
  .d-hero .d-title p{font-size:14px;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.3)}
  .d-hero .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(30,27,46,.55),rgba(30,27,46,0) 60%)}
  .d-body{padding:20px}
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .stat{flex:1;min-width:120px;background:var(--lav);border-radius:14px;padding:12px 14px}
  .stat .k{font-size:12px;color:var(--muted);font-weight:600}
  .stat .v{font-size:16px;font-weight:800;margin-top:2px}
  .sec-title{font-size:16px;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
  .itin{position:relative;padding-left:22px}
  .itin::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--lav-2)}
  .day{position:relative;padding:0 0 16px 6px}
  .day::before{content:"";position:absolute;left:-19px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--purple);border:3px solid #fff;box-shadow:0 0 0 2px var(--lav-2)}
  .day .dn{font-size:13px;font-weight:800;color:var(--purple-d)}
  .day .dt{font-size:14px;color:var(--ink);margin-top:1px}
  .day-badge{display:inline-flex;align-items:center;gap:4px;margin-left:8px;background:linear-gradient(135deg,#f43f5e,#ec4899);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;vertical-align:middle;white-space:nowrap}
  .breakdown{border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .brow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
  .brow:last-child{border-bottom:none}
  .brow .bi{width:36px;height:36px;border-radius:10px;background:var(--lav);display:grid;place-items:center;color:var(--purple-d);flex-shrink:0}
  .brow .bt{flex:1}
  .brow .bt .b1{font-weight:700;font-size:14px}
  .brow .bt .b2{font-size:12px;color:var(--muted)}
  .brow .bp{font-weight:800}
  .brow.total{background:var(--lav);font-size:16px}
  .brow.total .bt .b1{font-weight:800}
  .partners{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
  .plogo{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-weight:700;font-size:12px;color:var(--ink)}
  .stickybar{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .stickybar .pp{font-size:12px;color:var(--muted)}
  .stickybar .pp b{font-size:20px;color:var(--ink);display:block}
  .btn{background:linear-gradient(135deg,var(--purple),var(--purple-d));color:#fff;border:none;padding:14px 26px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;flex-shrink:0}
  .btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .btn.ghost{background:#fff;color:var(--purple-d);border:1.5px solid var(--purple-l)}
  .subbar{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .subbar .lk{color:var(--purple-d);cursor:pointer;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
  /* Compare */
  .cmp{padding:20px;overflow-x:auto}
  table.ct{width:100%;border-collapse:collapse;font-size:14px}
  table.ct th,table.ct td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line)}
  table.ct th{font-size:13px;color:var(--muted);font-weight:700}
  table.ct td.d{font-weight:800;color:var(--purple-d)}
  table.ct tr:hover{background:var(--lav)}
  /* Checkout */
  .co{padding:20px;flex:1;overflow-y:auto}
  .co h2{font-size:22px;font-weight:800;margin-bottom:4px}
  .co .lead{color:var(--muted);font-size:14px;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  .field input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;outline:none}
  .field input:focus{border-color:var(--purple-l)}
  .grid2{display:flex;gap:12px}.grid2 .field{flex:1}
  .summary{background:var(--lav);border-radius:16px;padding:16px;margin-bottom:18px}
  .summary .sr{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
  .summary .sr.tot{font-weight:800;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
  .secure{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px}
  /* Confirmation */
  .cf{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
  .cf .ok{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:grid;place-items:center;color:#fff;margin-bottom:20px;animation:pop .5s ease}
  .cf h2{font-size:26px;font-weight:800;margin-bottom:8px}
  .cf p{color:var(--muted);max-width:420px;margin-bottom:6px}
  .cf .ref{background:var(--lav);border-radius:14px;padding:14px 22px;margin:18px 0;font-weight:800;letter-spacing:1px;color:var(--purple-d)}
  .demo-badge{position:fixed;bottom:14px;left:14px;background:var(--ink);color:#fff;font-size:11px;padding:6px 11px;border-radius:20px;opacity:.7;z-index:50;font-weight:600}
  /* Bottom nav */
  .nav{display:flex;border-top:1px solid var(--line);background:rgba(255,255,255,.97);backdrop-filter:blur(10px);flex-shrink:0}
  .nav button{flex:1;border:none;background:none;cursor:pointer;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;transition:.15s}
  .nav button.on{color:var(--purple-d)}
  .nav button svg{width:22px;height:22px}
  .nav button.on svg{transform:translateY(-1px)}
  /* Generic page */
  .page{flex:1;overflow-y:auto;padding:20px}
  .page h2.ph{font-size:22px;font-weight:800;margin-bottom:4px}
  .page .psub{color:var(--muted);font-size:14px;margin-bottom:16px}
  .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
  .badge.up{background:#dcfce7;color:#15803d}.badge.done{background:var(--lav-2);color:var(--purple-d)}
  /* Trips */
  .trip{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;cursor:pointer;transition:.2s;background:#fff}
  .trip:hover{border-color:var(--purple-l);box-shadow:var(--shadow-sm)}
  .trip .thumb{width:74px;height:74px;border-radius:12px;overflow:hidden;position:relative;flex-shrink:0}
  .trip .ti{flex:1}.trip .ti .tn{font-weight:800;font-size:16px}
  .trip .ti .td{font-size:13px;color:var(--muted);margin-top:2px}
  .trip .ti .tl{font-size:12px;color:var(--purple-d);font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
  /* Recap */
  .rc-hero{height:150px;position:relative;display:flex;align-items:flex-end;border-radius:16px;overflow:hidden;margin-bottom:14px}
  .rc-hero .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(30,27,46,.6),transparent 70%)}
  .rc-hero .rt{position:relative;padding:14px;color:#fff}.rc-hero .rt h2{font-size:24px;font-weight:800}
  .rc-hero .rt p{font-size:13px;opacity:.95}
  .rc-stats{display:flex;gap:8px;margin-bottom:16px}
  .rc-stat{flex:1;background:var(--lav);border-radius:12px;padding:10px;text-align:center}
  .rc-stat .n{font-size:19px;font-weight:800;color:var(--purple-d)}
  .rc-stat .l{font-size:11px;color:var(--muted);font-weight:600}
  .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .photo{border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1/1;box-shadow:var(--shadow-sm)}
  .photo.wide{grid-column:span 2;aspect-ratio:2/1}
  .photo .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;color:#fff;font-size:12px;font-weight:600;background:linear-gradient(to top,rgba(30,27,46,.75),transparent);text-shadow:0 1px 4px rgba(0,0,0,.4)}
  .aigen{display:flex;align-items:center;gap:8px;background:var(--lav);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--purple-d);font-weight:600;margin:14px 0}
  /* Profile */
  .prof-hero{display:flex;align-items:center;gap:16px;margin-bottom:20px}
  .prof-hero .pav{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--purple-l));color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800}
  .prof-hero .pn{font-size:20px;font-weight:800}.prof-hero .pm{font-size:13px;color:var(--muted)}
  .prof-stats{display:flex;gap:8px;margin-bottom:20px}
  .prof-stats .s{flex:1;background:var(--lav);border-radius:14px;padding:12px;text-align:center}
  .prof-stats .s .n{font-size:18px;font-weight:800}.prof-stats .s .l{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
  .premium{background:linear-gradient(135deg,var(--purple),var(--purple-d));color:#fff;border-radius:18px;padding:18px;margin-bottom:20px}
  .premium h3{font-size:17px;font-weight:800;margin-bottom:4px}.premium p{font-size:13px;opacity:.9;margin-bottom:12px}
  .premium button{background:#fff;color:var(--purple-d);border:none;padding:10px 18px;border-radius:12px;font-weight:800;cursor:pointer;font-size:14px}
  .menu{border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .menu .row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;cursor:pointer}
  .menu .row:last-child{border-bottom:none}.menu .row:hover{background:var(--lav)}
  .menu .row .rv{color:var(--muted);font-weight:500;font-size:13px}
  /* Viral / trending */
  .viral-badge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#f43f5e,#ec4899);color:#fff;font-weight:800;font-size:11px;padding:5px 9px;border-radius:20px;box-shadow:var(--shadow-sm)}
  .pers-banner{margin:2px 0 6px 44px;background:var(--lav);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:13px}
  .pers-banner .pb-t{font-weight:800;color:var(--purple-d);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .pers-banner .tags{margin-top:0}
  .trend-strip{margin:16px 0 4px}
  .trend-strip .th{font-size:13px;font-weight:800;color:#e11d48;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .trend-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
  .trend-card{flex-shrink:0;width:130px;border-radius:14px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:#fff;transition:.2s}
  .trend-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--purple-l)}
  .trend-card .tc-sc{height:74px;position:relative}
  .trend-card .tc-b{padding:8px 10px}.trend-card .tc-b .n{font-weight:800;font-size:13px}
  .trend-card .tc-b .v{font-size:11px;color:#e11d48;font-weight:700;margin-top:1px}
  .viral-sec{border:1px solid #fbcfe8;background:linear-gradient(135deg,#fff1f2,#fdf2f8);border-radius:16px;padding:14px 16px;margin-top:14px}
  .viral-sec .vs-h{font-weight:800;font-size:14px;color:#be185d;display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .viral-sec .vs-t{font-size:13px;color:#831843}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  @media(max-width:520px){.bubble,.analyze{max-width:88%}.cards,.rec-head,.compare-btn{margin-left:0}.d-hero{height:170px}}
</style>
</head>
<body>
<div id="root"></div>
<div class="demo-badge">PROTOTYP · Demo-Daten</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const LANDING_URL = "index.html";

/* ---------- Inline scene illustrations ---------- */
function Scene({type, big}){
  const scenes = {
    vietnam:(
      <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" style={{width:'100%',height:'100%'}}>
        <defs><linearGradient id="vsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#c4b5fd"/><stop offset="1" stopColor="#a5f3fc"/></linearGradient></defs>
        <rect width="400" height="200" fill="url(#vsky)"/>
        <circle cx="320" cy="50" r="26" fill="#fef3c7" opacity=".9"/>
        <path d="M0 150 Q60 110 120 140 T260 130 T400 150 V200 H0Z" fill="#5b8c5a" opacity=".85"/>
        <path d="M0 165 Q100 135 200 160 T400 160 V200 H0Z" fill="#3f6b47"/>
        <rect x="180" y="95" width="34" height="60" fill="#7c3aed" opacity=".85"/>
        <polygon points="180,95 197,72 214,95" fill="#6d28d9"/>
        <polygon points="184,80 197,62 210,80" fill="#8b5cf6"/>
        <rect x="120" y="150" width="160" height="40" fill="#1e3a5f" opacity=".55"/>
      </svg>),

function Card({d, onClick}){
  return (
    <div className="card" onClick={onClick}>
      <div className="scene"><Scene type={d.type}/><span className="match">{d.match}% Match</span></div>
      <div className="body">
        <div className="top">
          <div><h3>{d.name}</h3><div className="sub">{d.region}</div></div>
          <div className="price">ab {d.from} €<small>{d.best} · p.P.</small></div>
        </div>
        <div className="tags">{d.tags.map(t=><span className="tag" key={t}>{t}</span>)}</div>
      </div>
    </div>
  );
}

function Analyzing({onDone}){
  const steps=['Verstehe deine Wünsche','Analysiere Preise & Flüge','Prüfe Wetter & Verfügbarkeiten','Vergleiche passende Reiseziele'];
  const [i,setI]=useState(0);
  useEffect(()=>{
    if(i<steps.length){const t=setTimeout(()=>setI(i+1),650);return()=>clearTimeout(t);}
    const t=setTimeout(onDone,500);return()=>clearTimeout(t);
  },[i]);
  return (
    <div className="msg bot">
      <div className="avatar">{I.logo}</div>
      <div className="analyze">
        {steps.map((s,idx)=>(
          <div key={s} className={"astep "+(idx<i?'done ':'')+(idx<=i?'on':'')}>
            <span className="dot"></span>{s}
          </div>
        ))}
      </div>
    </div>
  );
}

function ChatScreen({state, dispatch}){
  const endRef=useRef(null);
  const [text,setText]=useState('');
  useEffect(()=>{endRef.current&&endRef.current.scrollIntoView({behavior:'smooth'});},[state.messages,state.phase]);

  const chips=[
    '7 Tage, max. 800 €, gutes Essen, Natur, wenig Touristen',
    'Strand & Städtetrip, entspannt, 1 Woche',
    'Abenteuer & Wandern, kleines Budget, wenig Touristen'
  ];
  const submit=(val)=>{
    const q=(val??text).trim(); if(!q) return;
    setText(''); dispatch({type:'ASK', q});
  };
  return (
    <>
      <div className="chat">
        {state.messages.length===0 && (
          <div className="intro">
            <h1>Wohin soll deine nächste Reise gehen?</h1>
            <p>Beschreibe einfach, wie sich deine Reise anfühlen soll – Budget, Dauer, Stimmung. PLANORA findet das passende Ziel, vergleicht und bucht.</p>
          </div>
        )}
        {state.messages.map((m,idx)=>(
          <div key={idx} className={"msg "+(m.role==='user'?'user':'bot')}>
            {m.role==='bot'&&<div className="avatar">{I.logo}</div>}
            <div className="bubble">{m.text}</div>
          </div>
        ))}
        {state.phase==='analyzing' && <Analyzing onDone={()=>dispatch({type:'RESULTS'})}/>}
        {state.phase==='results' && <>
          {state.detected.length>0 && (
            <div className="pers-banner">
              <div className="pb-t">{I.logo} Personalisiert für dich</div>
              <div className="tags">{state.detected.map(t=><span className="tag" key={t}>{t}</span>)}</div>
            </div>
          )}
          <div className="rec-head">Deine besten Reisevorschläge</div>
          <div className="cards">
            {state.order.map(id=><Card key={id} d={DEST[id]} onClick={()=>dispatch({type:'OPEN',id})}/>)}
          </div>
          <button className="compare-btn" onClick={()=>dispatch({type:'COMPARE'})}>{I.compare} Alle 3 vergleichen</button>
        </>}
        <div ref={endRef}/>
      </div>
      <div className="inputbar">
        {state.messages.length===0 && (
          <div className="chips">{chips.map(c=><button className="chip" key={c} onClick={()=>submit(c)}>{c}</button>)}</div>
        )}
        <div className="ib-row">
          <textarea rows="1" placeholder="Schreib deinen Reisewunsch…" value={text}
            onChange={e=>setText(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();}}}/>
          <button className="send" disabled={!text.trim()} onClick={()=>submit()}>{I.send}</button>
        </div>
      </div>
    </>
  );
}

/* ---------- App / state machine ---------- */
const TAG_RULES=[
  {re:/natur|wald|berg|see|ruhe|abgeschieden/i, tag:'Natur', v:{vietnam:2,georgien:2,portugal:0}},
  {re:/essen|kulinar|food|streetfood|küche|genuss/i, tag:'Gutes Essen', v:{vietnam:2,portugal:2,georgien:1}},
  {re:/wenig tourist|geheimtipp|abseits|überlaufen|ruhig|nicht überlaufen/i, tag:'Wenig Touristen', v:{georgien:2,vietnam:1,portugal:0}},
  {re:/strand|meer|beach|küste|sonne|baden/i, tag:'Strand & Sonne', v:{portugal:3,vietnam:0,georgien:0}},
  {re:/stadt|städt|city|kultur|museum|architektur/i, tag:'Städte & Kultur', v:{portugal:2,vietnam:1,georgien:1}},
  {re:/abenteuer|wandern|hiking|trekking|aktiv|outdoor/i, tag:'Abenteuer', v:{georgien:3,vietnam:1,portugal:0}},
  {re:/günstig|billig|budget|wenig geld|sparen|backpack/i, tag:'Kleines Budget', v:{georgien:2,vietnam:1,portugal:0}}
];
function personalize(q){
  const scores={vietnam:0,portugal:0,georgien:0}; const detected=[];
  TAG_RULES.forEach(r=>{ if(r.re.test(q)){ detected.push(r.tag); for(const k in r.v) scores[k]+=r.v[k]; }});
  const order=(scores.vietnam||scores.portugal||scores.georgien)?[...ORDER].sort((a,b)=>scores[b]-scores[a]):[...ORDER];
  return {order, detected};
}
const initial={ tab:'plan', phase:'chat', messages:[], sel:null, recapId:'lissabon', order:ORDER, detected:[] };
function reducer(s,a){
  switch(a.type){
    case 'TAB': return {...s, tab:a.tab};
    case 'ASK':{
      const p=personalize(a.q);
      const cheap=/malediven|luxus|luxury/i.test(a.q) && /300|400|billig|günstig/i.test(a.q);
      const msgs=[...s.messages,{role:'user',text:a.q}];
      let lead;
      if(cheap){ lead='Ehrlich gesagt: Für die Malediven mit 300 € wird’s eng. Aber keine Sorge – ich habe drei Ziele gefunden, die dein Gefühl von Traumreise treffen und ins Budget passen:'; }
      else if(p.detected.length){ lead='Verstanden – ich hab deine Wünsche erkannt: '+p.detected.join(', ')+'. Passend dazu sind das meine Top-Vorschläge für dich:'; }
      else{ lead='Perfekt! Ich habe verstanden, was du suchst. Hier sind meine besten Vorschläge für dich:'; }
      msgs.push({role:'bot',text:lead});
      return {...s, tab:'plan', messages:msgs, phase:'analyzing', order:p.order, detected:p.detected};
    }
    case 'RESULTS': return {...s, phase:'results'};
    case 'OPEN': return {...s, tab:'plan', sel:a.id, phase:'detail'};
    case 'COMPARE': return {...s, phase:'compare'};
    case 'CHECKOUT': return {...s, phase:'checkout'};
    case 'DONE': return {...s, phase:'confirmed'};
    case 'BACK': return {...s, phase:'results'};
    case 'RECAP': return {...s, tab:'recap', recapId:a.id};
    case 'RESET': return {...initial};
    default: return s;
  }
}
function App(){
  const [state,dispatch]=React.useReducer(reducer,initial);
  const d = state.sel?DEST[state.sel]:null;
  const planTop = state.phase==='chat'||state.phase==='analyzing'||state.phase==='results';
  const inFlow = state.tab==='plan' && !planTop; // detail/compare/checkout/confirmed
  const showNav = !inFlow;
  return (
    <div className="app">
      <Header/>
      {state.tab==='plan' && planTop && <ChatScreen state={state} dispatch={dispatch}/>}
      {state.tab==='plan' && state.phase==='detail' && <Detail d={d} dispatch={dispatch}/>}
      {state.tab==='plan' && state.phase==='compare' && <Compare dispatch={dispatch}/>}
      {state.tab==='plan' && state.phase==='checkout' && <Checkout d={d} dispatch={dispatch}/>}
      {state.tab==='plan' && state.phase==='confirmed' && <Confirmation d={d} dispatch={dispatch}/>}
      {state.tab==='trips' && <TripsScreen dispatch={dispatch}/>}
      {state.tab==='recap' && <RecapScreen recapId={state.recapId}/>}
      {state.tab==='profile' && <ProfileScreen/>}
      {showNav && <BottomNav tab={state.tab} dispatch={dispatch}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
